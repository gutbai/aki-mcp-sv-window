<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aki Project Context</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Aki Projects</h1>
    <form id="project-form">
      <input id="project-name" type="text" placeholder="Tên project" autocomplete="off" required>
      <div class="path-row">
        <input id="project-path" type="text" placeholder="Dán đường dẫn hoặc chọn folder…" autocomplete="off" spellcheck="false" required>
        <button id="pick-folder" type="button">Chọn folder…</button>
      </div>
      <div class="form-actions">
        <button id="save-project" type="submit">Thêm project</button>
        <button id="cancel-edit" type="button" hidden>Hủy</button>
      </div>
    </form>

    <p id="message" role="status"></p>
    <section id="project-list" aria-label="Projects"></section>

    <section class="auto-continue">
      <label class="toggle-row" for="auto-continue">
        <span>
          <strong>Auto Continue</strong>
          <small>Tự gửi tiếp cho tới khi câu trả lời có OK BOSS.</small>
        </span>
        <input id="auto-continue" type="checkbox">
      </label>
      <label class="prompt-label" for="auto-continue-prompt">Prompt mặc định</label>
      <textarea id="auto-continue-prompt" rows="3" spellcheck="false"></textarea>
      <div class="prompt-actions">
        <button id="save-auto-prompt" type="button">Lưu prompt</button>
        <button id="reset-auto-prompt" type="button">Mặc định</button>
      </div>
    </section>

    <section class="preview">
      <strong>New Chat sẽ tự điền</strong>
      <pre id="preview-text">Chưa có project mặc định.</pre>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
